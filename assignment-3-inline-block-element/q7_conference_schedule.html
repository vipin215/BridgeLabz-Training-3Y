<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <!-- Conference schedule table -->
    <table border="1">
        <caption>Conference Sessions</caption>

        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Morning</td>
                <td>09:00 AM</td>
                <td>Future of AI</td>
                <td>Dr. Sharma</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>01:00 PM</td>
                <td>Cloud Computing</td>
                <td>Ms. Gupta</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>05:00 PM</td>
                <td>Cyber Security</td>
                <td>Mr. Verma</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">End of Conference Schedule</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
