<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store - Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th colspan="5">Product Catalog</th>
        </tr>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Laptop"></td>
            <td>Laptop</td>
            <td>Lightweight laptop for students.</td>
            <td>₹55,000</td>
            <td rowspan="2">In Stock</td>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Headphones"></td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,000</td>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Keyboard"></td>
            <td>Keyboard</td>
            <td>USB mechanical keyboard.</td>
            <td>₹1,500</td>
            <td>Out of Stock</td>
        </tr>
    </table>
</body>
</html>
