<!DOCTYPE html>
<html lang="en">
<head>

    <title>Team Members</title>
    <link rel="stylesheet" href="03_team.css">
</head>
<body>
    <main class="team">
        <h1>Our Team</h1>
        <div class="cards">
            <article class="card">
                <h2>Raj</h2><h3>Frontend Developer</h3>
                <p>Creates clean and user-friendly web interfaces using HTML and CSS.</p>
            </article>
            <article class="card lead">
                <h2>Vipin</h2><h3>Team Lead</h3>
                <p>Coordinates the team, plans tasks, and helps maintain project quality.</p>
            </article>
            <article class="card">
                <h2>Vishal</h2><h3>Backend Developer</h3>
                <p>Works on application logic, databases, and reliable backend solutions.</p>
            </article>
        </div>
    </main>
