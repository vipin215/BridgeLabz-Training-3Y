<!DOCTYPE html>
<html>
<head>
    <title>Height and Width</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Height and Width Practice</h1>
</header>

<main class="container">

    <div class="box box1">
        <h2>Box 1</h2>
        <p>200px × 150px</p>
    </div>

    <div class="box box2">
        <h2>Box 2</h2>
        <p>50% Width</p>
    </div>

    <div class="box box3">
        <h2>Box 3</h2>
        <p>30vh Height</p>
        <p>This is some extra content to demonstrate overflow.</p>
    </div>

</main>

</body>
</html>
