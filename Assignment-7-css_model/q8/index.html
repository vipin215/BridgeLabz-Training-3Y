<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main>

    <div class="margin">
        Margin

        <div class="border">
            Border

            <div class="padding">
                Padding

                <div class="content">
                    Content
                </div>

            </div>
        </div>
    </div>

    <p>
        Content is the actual information.
        Padding gives space inside the border.
        Border surrounds the element.
        Margin gives space outside the border.
    </p>

</main>

</body>
</html>
