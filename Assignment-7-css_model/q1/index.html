<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Borders and Padding</h1>
</header>

<main class="container">

    <div class="box solid">
        <h2>Solid Border</h2>
        <p>Padding: 10px</p>
    </div>

    <div class="box dashed">
        <h2>Dashed Border</h2>
        <p>Padding: 20px</p>
    </div>

    <div class="box double">
        <h2>Double Border</h2>
        <p>Padding: 30px</p>
    </div>

    <div class="box groove">
        <h2>Groove Border</h2>
        <p>Rounded Corners</p>
    </div>

</main>

<footer>
    <p>CSS Border Practice</p>
</footer>

</body>
</html>
