<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>File Upload</title></head><body><!-- accept limits the file chooser to JPG and PNG types. --><form action="#" method="post" enctype="multipart/form-data"><label for="file">Choose file:</label><input type="file" id="file" name="file" accept=".jpg,.png,image/jpeg,image/png"><button type="submit">Upload</button></form><p>Only .jpg and .png image files are allowed.</p></body></html>
