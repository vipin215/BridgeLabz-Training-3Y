<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Form Security</title></head><body><!-- autocomplete="off" asks the browser not to automatically fill form data. --><form action="#" method="post" autocomplete="off"><label>Username: <input type="text" name="username" required></label><br><br><label>Email: <input type="email" name="email" required></label><br><br><label>Password: <input type="password" name="password" required></label><br><br><button type="submit">Submit</button></form><p>Turning off autocomplete can reduce automatic filling of sensitive data, especially on shared or public computers.</p></body></html>
