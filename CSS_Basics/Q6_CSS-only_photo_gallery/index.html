<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Photo Gallery</h1>
    <p>Responsive CSS-Only Gallery</p>
  </header>

  <main class="gallery">

    <div class="photo">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
      <div class="caption">Beautiful Mountain</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/id/1016/600/400" alt="Forest">
      <div class="caption">Green Forest</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
      <div class="caption">Cute Dog</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/id/1035/600/400" alt="River">
      <div class="caption">Peaceful River</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/id/1043/600/400" alt="Beach">
      <div class="caption">Sunny Beach</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/id/1050/600/400" alt="City">
      <div class="caption">Modern City</div>
    </div>

  </main>

</body>
</html>
