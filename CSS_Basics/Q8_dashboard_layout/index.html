<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="container">

        <aside class="sidebar">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main class="content">

            <div class="box">
                <h2>Overview</h2>
                <p>
                    Welcome to the dashboard. This section displays the latest updates
                    and important information.
                </p>
            </div>

            <div class="box">
                <h2>Statistics</h2>
                <p>
                    Total Users: 1200 <br>
                    Active Projects: 18 <br>
                    Completed Tasks: 256
                </p>
            </div>

        </main>

    </div>

</html>
